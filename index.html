<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya - The First Button (Origin System)</title>
    <style>
        body { margin: 0; background: #f7f6f0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="engineCanvas"></canvas>
    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render(); 
        }
        window.addEventListener('resize', resize);

        // ==========================================
        // 🎯 1. กระดุมเม็ดแรก: สมการแปลงพิกัดและล็อกกึ่งกลาง (Origin Anchoring)
        // ==========================================
        function project(x, y, z) {
            const angle = Math.PI / 6; // มุม Isometric 30 องศา
            
            // แปลง 3D เป็น 2D
            const isoX = (x - z) * Math.cos(angle);
            const isoY = -(y + (x + z) * Math.sin(angle));
            
            // ล็อกเป้าหมายให้ (0,0,0) ของเมมโมรี่ ตกลงตรงกลางจอภาพเป๊ะๆ แบบไดนามิก
            const scale = 1; 
            const screenX = (isoX * scale) + (canvas.width / 2);
            const screenY = (isoY * scale) + (canvas.height / 2);
            
            return { x: screenX, y: screenY };
        }

        // ==========================================
        // 📐 2. Render Pipeline (วาดเฉพาะแกนอ้างอิงเพื่อตรวจสอบ)
        // ==========================================
        function drawLine(p1, p2, color, text) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            if(text) {
                ctx.fillStyle = color;
                ctx.font = 'bold 14px monospace';
                ctx.fillText(text, p2.x + 5, p2.y + 5);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. วาดเส้น Crosshair ของหน้าจอ (เพื่อให้เห็นจุดกึ่งกลางที่แท้จริงของ Device)
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); // เส้นตั้ง
            ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); // เส้นนอน
            ctx.stroke();

            // 2. ดึงพิกัด (0,0,0) จากเมมโมรี่
            const origin = project(0, 0, 0);

            // 3. กำหนดแกนทั้ง 3 ทิศทาง (ความยาว 150 หน่วย)
            const axisX = project(150, 0, 0); // แกน X (ความกว้างฐาน) - สีแดง
            const axisY = project(0, 150, 0); // แกน Y (ความสูงอาคาร) - สีเขียว
            const axisZ = project(0, 0, 150); // แกน Z (ความลึกฐาน) - สีน้ำเงิน

            // วาดเส้นแกนจากจุด Origin ออกไป
            drawLine(origin, axisX, '#ff4444', 'X+ (Width)');
            drawLine(origin, axisY, '#44aa44', 'Y+ (Height)');
            drawLine(origin, axisZ, '#4444ff', 'Z+ (Depth)');

            // มาร์คจุด Origin (0,0,0) ด้วยจุดสีดำ
            ctx.beginPath();
            ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();
            
            // พิมพ์ตัวเลขยืนยันจุดกึ่งกลาง
            ctx.fillStyle = '#000';
            ctx.fillText(`Origin (0,0,0) is at Screen: ${Math.round(canvas.width/2)}px, ${Math.round(canvas.height/2)}px`, origin.x - 140, origin.y - 20);
        }

        resize(); // เรียกทำงานครั้งแรก
    </script>
</body>
</html>
