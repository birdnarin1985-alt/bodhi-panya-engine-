<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya - Workshop #4: Gable Roof</title>
    <style>
        body { margin: 0; background: #f6f4ee; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="engineCanvas"></canvas>
    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }
        window.addEventListener('resize', resize);

        // ==========================================
        // 🎯 1. ISOMETRIC PROJECTION
        // ==========================================
        function project(x, y, z) {
            const angle = Math.PI / 6; 
            const scale = 2.3;

            const isoX = (x - z) * Math.cos(angle);
            const isoY = -(y + (x + z) * Math.sin(angle));

            const screenX = (isoX * scale) + (canvas.width / 2);
            const screenY = (isoY * scale) + (canvas.height / 2) + 60; // ปรับลงเพื่อรองรับยอดหลังคา

            return { x: screenX, y: screenY };
        }

        // ==========================================
        // 🧱 2. MEMORY BUFFER (ฐาน + เสา + คาน + จั่ว)
        // ==========================================
        const halfSize = 25;
        const baseH = 50;
        const pillarH = 40;
        const beamH = baseH + pillarH; // 90
        const ridgeH = beamH + 35;     // 125 (ยอดอกไก่)

        const V = {
            // ฐาน
            b0: { x: -halfSize, y: 0,     z: -halfSize },
            b1: { x:  halfSize, y: 0,     z: -halfSize },
            b2: { x:  halfSize, y: 0,     z:  halfSize },
            b3: { x: -halfSize, y: 0,     z:  halfSize },

            t0: { x: -halfSize, y: baseH, z: -halfSize },
            t1: { x:  halfSize, y: baseH, z: -halfSize },
            t2: { x:  halfSize, y: baseH, z:  halfSize },
            t3: { x: -halfSize, y: baseH, z:  halfSize },

            // หัวเสา
            p0: { x: -halfSize, y: beamH, z: -halfSize },
            p1: { x:  halfSize, y: beamH, z: -halfSize },
            p2: { x:  halfSize, y: beamH, z:  halfSize },
            p3: { x: -halfSize, y: beamH, z:  halfSize },

            // ยอดสันอกไก่ (Center Line X=0)
            r0: { x: 0, y: ridgeH, z: -halfSize }, // ยอดอกไก่หลัง
            r1: { x: 0, y: ridgeH, z:  halfSize }  // ยอดอกไก่หน้า
        };

        const sceneGraph = [
            // ระนาบฐาน
            { type: 'face', id: 'base-left',   vertices: [V.b0, V.b3, V.t3, V.t0], fillAccent: null, hatch: true, hatchDensity: 6 },
            { type: 'face', id: 'base-right',  vertices: [V.b3, V.b2, V.t2, V.t3], fillAccent: null, hatch: false },

            // ผืนหลังคาฝั่งขวา (ลาดลงหาเสาขวา)
            { type: 'face', id: 'roof-slope-right', vertices: [V.r0, V.r1, V.p2, V.p1], fillAccent: 'rgba(230, 140, 40, 0.25)', hatch: false },
            
            // หน้าจั่วสามเหลี่ยมด้านหน้า
            { type: 'face', id: 'gable-front', vertices: [V.r1, V.p3, V.p2], fillAccent: null, hatch: true, hatchDensity: 5 },

            // เสา 4 ต้น
            { type: 'line', id: 'col-back-left',   v1: V.t0, v2: V.p0, width: 1.5, overShoot: 6, jitter: 1.0 },
            { type: 'line', id: 'col-back-right',  v1: V.t1, v2: V.p1, width: 1.5, overShoot: 6, jitter: 1.0 },
            { type: 'line', id: 'col-front-right', v1: V.t2, v2: V.p2, width: 1.8, overShoot: 7, jitter: 1.2 },
            { type: 'line', id: 'col-front-left',  v1: V.t3, v2: V.p3, width: 1.8, overShoot: 7, jitter: 1.2 },

            // คานรัด 4 ทิศ
            { type: 'line', id: 'beam-back',  v1: V.p0, v2: V.p1, width: 1.4, overShoot: 6, jitter: 1.0 },
            { type: 'line', id: 'beam-right', v1: V.p1, v2: V.p2, width: 1.5, overShoot: 7, jitter: 1.1 },
            { type: 'line', id: 'beam-front', v1: V.p2, v2: V.p3, width: 1.8, overShoot: 7, jitter: 1.2 },
            { type: 'line', id: 'beam-left',  v1: V.p3, v2: V.p0, width: 1.4, overShoot: 6, jitter: 1.0 },

            // สันอกไก่ (Ridge Center Line)
            { type: 'line', id: 'ridge-beam', v1: V.r0, v2: V.r1, width: 2.2, overShoot: 10, jitter: 1.2 },

            // จันทัน 4 มุม
            { type: 'line', id: 'rafter-back-left',  v1: V.r0, v2: V.p0, width: 1.4, overShoot: 6, jitter: 1.0 },
            { type: 'line', id: 'rafter-back-right', v1: V.r0, v2: V.p1, width: 1.4, overShoot: 6, jitter: 1.0 },
            { type: 'line', id: 'rafter-front-left', v1: V.r1, v2: V.p3, width: 1.7, overShoot: 7, jitter: 1.1 },
            { type: 'line', id: 'rafter-front-right',v1: V.r1, v2: V.p2, width: 1.7, overShoot: 7, jitter: 1.1 }
        ];

        // ==========================================
        // 🖌️ 3. INK & HATCH STYLIZER
        // ==========================================
        function drawInkLine(p1, p2, width = 1.4, overShoot = 6, jitter = 1.0) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;

            const uX = dx / len;
            const uY = dy / len;

            const startX = p1.x - (uX * overShoot);
            const startY = p1.y - (uY * overShoot);
            const endX   = p2.x + (uX * overShoot);
            const endY   = p2.y + (uY * overShoot);

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            const steps = Math.max(3, Math.floor(len / 16));
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const rJitterX = (Math.random() - 0.5) * jitter;
                const rJitterY = (Math.random() - 0.5) * jitter;
                ctx.lineTo(startX + (endX - startX) * t + rJitterX, startY + (endY - startY) * t + rJitterY);
            }

            ctx.strokeStyle = '#1e1c1a';
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawFaceHatching(pts, density = 6) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.clip();

            ctx.strokeStyle = 'rgba(30, 28, 25, 0.4)';
            ctx.lineWidth = 0.9;

            let minX = Math.min(...pts.map(p => p.x));
            let maxX = Math.max(...pts.map(p => p.x));
            let minY = Math.min(...pts.map(p => p.y));
            let maxY = Math.max(...pts.map(p => p.y));

            for (let x = minX - (maxY - minY); x < maxX; x += density) {
                ctx.beginPath();
                ctx.moveTo(x, minY);
                ctx.lineTo(x + (maxY - minY), maxY);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ==========================================
        // 🚀 4. RENDER PIPELINE
        // ==========================================
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // คำนวณ Z-Depth
            sceneGraph.forEach(item => {
                if (item.type === 'face') {
                    let zSum = 0;
                    item.vertices.forEach(v => zSum += (v.x + v.y + v.z));
                    item.zDepth = zSum / item.vertices.length;
                } else if (item.type === 'line') {
                    item.zDepth = (item.v1.x + item.v1.y + item.v1.z + item.v2.x + item.v2.y + item.v2.z) / 2;
                }
            });
            sceneGraph.sort((a, b) => a.zDepth - b.zDepth);

            // Pass 1: ระบายสีและสานเส้น
            sceneGraph.forEach(item => {
                if (item.type === 'face') {
                    const pts = item.vertices.map(v => project(v.x, v.y, v.z));

                    if (item.fillAccent) {
                        ctx.beginPath();
                        ctx.moveTo(pts[0].x, pts[0].y);
                        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                        ctx.closePath();
                        ctx.fillStyle = item.fillAccent;
                        ctx.fill();
                    }

                    if (item.hatch) {
                        drawFaceHatching(pts, item.hatchDensity);
                    }
                }
            });

            // Pass 2: เส้นหมึกสดตวัดปลาย
            sceneGraph.forEach(item => {
                if (item.type === 'face') {
                    const pts = item.vertices.map(v => project(v.x, v.y, v.z));
                    for (let i = 0; i < pts.length; i++) {
                        const next = (i + 1) % pts.length;
                        drawInkLine(pts[i], pts[next], 1.3, 5, 1.0);
                    }
                } else if (item.type === 'line') {
                    const p1 = project(item.v1.x, item.v1.y, item.v1.z);
                    const p2 = project(item.v2.x, item.v2.y, item.v2.z);
                    drawInkLine(p1, p2, item.width, item.overShoot, item.jitter);
                }
            });
        }

        resize();
    </script>
</body>
</html>
