<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya Engine - Grand Temple Courtyard Suite</title>
    <style>
        body {
            margin: 0;
            background: #f4f1ea;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif;
            user-select: none;
        }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.94);
            padding: 18px 24px;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            pointer-events: none;
            max-width: 410px;
            border-left: 5px solid #d4a373;
        }
        h1 { margin: 0 0 6px 0; font-size: 17px; color: #2c241d; font-weight: 600; }
        p { margin: 0; font-size: 12px; color: #6b5b52; line-height: 1.5; }
        .badge {
            display: inline-block;
            margin-top: 10px;
            background: #faedcd;
            color: #8c6d46;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.8px;
        }

        #control-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.94);
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            width: 270px;
        }
        .control-group-title {
            font-size: 12px;
            font-weight: 600;
            color: #2c241d;
            margin-bottom: 4px;
            border-bottom: 1px solid #e6e2d6;
            padding-bottom: 4px;
        }
        .mode-btn {
            background: #f4f1ea;
            color: #2c241d;
            border: 1px solid #d4a373;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: 'Sarabun', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .mode-btn:hover, .mode-btn.active {
            background: #2c241d;
            color: #f4f1ea;
            border-color: #2c241d;
        }
        #time-slider-box {
            font-size: 11px;
            color: #6b5b52;
            margin-top: 4px;
        }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #d4a373; margin-top: 6px; }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="control-group-title">🏛️ Master Showcase Controls</div>
        <button class="mode-btn" id="btn-xray" onclick="setMode('xray')">🧬 1. โครงกระดูก & ลานวัด (X-Ray)</button>
        <button class="mode-btn active" id="btn-flesh" onclick="setMode('flesh')">🏛️ 2. วิหารสมบูรณ์ & บันไดนาค (Full)</button>
        <button class="mode-btn" id="btn-time" onclick="setMode('time')">⏳ 3. มิติเวลา (Time Axis Cycle)</button>
        
        <div id="time-slider-box">
            <label for="timeSlider">แกนเวลา (Temporal Flow): <span id="timeVal">1.00</span></label><br>
            <input type="range" id="timeSlider" min="0" max="2" step="0.01" value="1.0" oninput="onTimeSlider(this.value)">
        </div>
    </div>

    <canvas id="engineCanvas"></canvas>

    <div id="ui-overlay">
        <h1>Bodhi-Panya Engine</h1>
        <p>สถาปัตยกรรมวิหาร 100 เมตร บันไดนาคราช และลานวัดอันร่มรื่น ขับเคลื่อนด้วยระบบโครงสร้างเซลล์มีชีวิต (Linked List Organism)</p>
        <div class="badge">GRAND TEMPLE COURTYARD SUITE FOR DR. JIMMY</div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');

        let currentMode = 'flesh';
        let manualTimeFactor = 1.0;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            const slider = document.getElementById('timeSlider');
            if (mode === 'time') {
                slider.disabled = false;
            } else {
                slider.disabled = true;
                if (mode === 'flesh' || mode === 'xray') manualTimeFactor = 1.0;
            }
        }

        function onTimeSlider(val) {
            manualTimeFactor = parseFloat(val);
            document.getElementById('timeVal').innerText = manualTimeFactor.toFixed(2);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. นาม & ธาตุวาโย (Cellular Breath Node)
        class ArchitecturalCell {
            constructor(id, x, y, z) {
                this.id = id;
                this.ox = x; this.oy = y; this.oz = z;
                this.x = x; this.y = y; this.z = z;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.028;
                this.amplitude = (this.oy > 0) ? 0.45 : 0.0; 
            }

            update(time, lifecycleFactor) {
                const effectiveY = this.oy * Math.min(1.0, lifecycleFactor * 1.2);
                this.y = effectiveY;

                if (this.amplitude > 0 && lifecycleFactor > 0.3) {
                    this.phase += this.speed;
                    this.x = this.ox + Math.sin(this.phase + time) * this.amplitude * Math.min(1.0, lifecycleFactor);
                } else {
                    this.x = this.ox;
                }
            }
        }

        // 2. สร้างโครงสร้างวิหาร 100 เมตร บันไดนาคราช และลานวัด
        const halfW = 28;       
        const groundH = 0;      
        const baseH = 25;       
        const pillarH = 50;     
        const beamH = baseH + pillarH; 
        
        const lowerRidgeH = beamH + 32;   
        const upperRidgeH = beamH + 68;   
        const spireTopH   = upperRidgeH + 85; 

        const totalBays = 20;   
        const bayLen = 16.5;    

        const nodesMap = new Map();
        const skeletonLines = [];
        const dynamicFleshFaces = [];

        function addNode(id, x, y, z) {
            if (!nodesMap.has(id)) {
                nodesMap.set(id, new ArchitecturalCell(id, x, y, z));
            }
            return nodesMap.get(id);
        }

        // ⛩️ สร้างลานวัดรอบอาคาร (Courtyard / Lan Wat)
        const courtyardFaces = [
            { zDepth: -160, vertices: [{x:-55, y:groundH, z:15}, {x:55, y:groundH, z:15}, {x:55, y:groundH, z:-340}, {x:-55, y:groundH, z:-340}], color: 'rgba(215, 208, 195, 0.45)' }
        ];

        for (let i = 0; i < totalBays; i++) {
            const zFront = -(i * bayLen);
            const zBack  = -((i + 1) * bayLen);

            const footL_under = addNode(`footL_under_${i}`, -halfW - 3, groundH - 10, zFront);
            const footL_top   = addNode(`footL_top_${i}`, -halfW, groundH, zFront);
            const footR_under = addNode(`footR_under_${i}`, halfW + 3, groundH - 10, zFront);
            const footR_top   = addNode(`footR_top_${i}`, halfW, groundH, zFront);

            const cL_base = addNode(`colL_base_${i}`, -halfW, baseH, zFront);
            const cL_cornice = addNode(`colL_cornice_${i}`, -halfW, beamH - 6, zFront);
            const cL_top  = addNode(`colL_top_${i}`, -halfW, beamH, zFront);
            
            const cR_base = addNode(`colR_base_${i}`, halfW, baseH, zFront);
            const cR_cornice = addNode(`colR_cornice_${i}`, halfW, beamH - 6, zFront);
            const cR_top  = addNode(`colR_top_${i}`, halfW, beamH, zFront);

            const cL_base_back = addNode(`colL_base_${i+1}`, -halfW, baseH, zBack);
            const cL_top_back  = addNode(`colL_top_${i+1}`, -halfW, beamH, zBack);
            const cR_base_back = addNode(`colR_base_${i+1}`, halfW, baseH, zBack);
            const cR_top_back  = addNode(`colR_top_${i+1}`, halfW, beamH, zBack);

            const rLowFront = addNode(`rLow_${i}`, 0, lowerRidgeH, zFront);
            const rLowBack  = addNode(`rLow_${i+1}`, 0, lowerRidgeH, zBack);
            const rUpFront  = addNode(`rUp_${i}`, 0, upperRidgeH, zFront);
            const rUpBack   = addNode(`rUp_${i+1}`, 0, upperRidgeH, zBack);

            skeletonLines.push({ p1: footL_under, p2: footL_top, w: 2.2, type: 'struct' });
            skeletonLines.push({ p1: footR_under, p2: footR_top, w: 2.2, type: 'struct' });
            skeletonLines.push({ p1: footL_top, p2: cL_base, w: 1.8, type: 'struct' });
            skeletonLines.push({ p1: footR_top, p2: cR_base, w: 1.8, type: 'struct' });
            skeletonLines.push({ p1: cL_base, p2: cL_top, w: 1.6, type: 'struct' });
            skeletonLines.push({ p1: cR_base, p2: cR_top, w: 1.6, type: 'struct' });
            skeletonLines.push({ p1: cL_top, p2: cL_top_back, w: 1.3, type: 'struct' });
            skeletonLines.push({ p1: cR_top, p2: cR_top_back, w: 1.3, type: 'struct' });
            skeletonLines.push({ p1: rLowFront, p2: rLowBack, w: 1.4, type: 'struct' });
            skeletonLines.push({ p1: rUpFront, p2: rUpBack, w: 1.6, type: 'struct' });
            skeletonLines.push({ p1: cL_top, p2: rLowFront, w: 1.2, type: 'struct' });
            skeletonLines.push({ p1: cR_top, p2: rLowFront, w: 1.2, type: 'struct' });
            skeletonLines.push({ p1: rLowFront, p2: rUpFront, w: 1.3, type: 'struct' });

            skeletonLines.push({ p1: cL_base, p2: cL_cornice, w: 2.0, type: 'molding' });
            skeletonLines.push({ p1: cR_base, p2: cR_cornice, w: 2.0, type: 'molding' });

            dynamicFleshFaces.push({
                getZDepth: () => (rUpFront.z + rUpBack.z) / 2,
                nodes: [rUpBack, rUpFront, cL_top, cL_top_back],
                color: 'rgba(212, 163, 115, 0.32)', type: 'roof'
            });
            dynamicFleshFaces.push({
                getZDepth: () => (rUpFront.z + rUpBack.z) / 2,
                nodes: [rUpBack, rUpFront, cR_top, cR_top_back],
                color: 'rgba(180, 130, 90, 0.26)', type: 'roof'
            });

            dynamicFleshFaces.push({
                getZDepth: () => (zFront + zBack) / 2,
                nodes: [cL_base, cL_cornice, cL_top_back, cL_base_back],
                color: 'rgba(240, 235, 225, 0.82)', type: 'wall'
            });
            dynamicFleshFaces.push({
                getZDepth: () => (zFront + zBack) / 2,
                nodes: [cR_base, cR_cornice, cR_top_back, cR_base_back],
                color: 'rgba(240, 235, 225, 0.82)', type: 'wall'
            });

            if (i > 0 && i < totalBays - 1) {
                const wZ1 = -(i * bayLen) + 4;
                const wZ2 = -(i * bayLen) + 12;
                const winTop = baseH + 35;
                const winBot = baseH + 12;
                
                const winL_b1 = addNode(`winL_b1_${i}`, -halfW - 0.5, winBot, wZ1);
                const winL_t1 = addNode(`winL_t1_${i}`, -halfW - 0.5, winTop, wZ1);
                const winL_t2 = addNode(`winL_t2_${i}`, -halfW - 0.5, winTop, wZ2);
                const winL_b2 = addNode(`winL_b2_${i}`, -halfW - 0.5, winBot, wZ2);

                const winR_b1 = addNode(`winR_b1_${i}`, halfW + 0.5, winBot, wZ1);
                const winR_t1 = addNode(`winR_t1_${i}`, halfW + 0.5, winTop, wZ1);
                const winR_t2 = addNode(`winR_t2_${i}`, halfW + 0.5, winTop, wZ2);
                const winR_b2 = addNode(`winR_b2_${i}`, halfW + 0.5, winBot, wZ2);

                dynamicFleshFaces.push({
                    getZDepth: () => wZ1,
                    nodes: [winL_b1, winL_t1, winL_t2, winL_b2],
                    color: 'rgba(130, 190, 220, 0.45)', type: 'window'
                });
                dynamicFleshFaces.push({
                    getZDepth: () => wZ1,
                    nodes: [winR_b1, winR_t1, winR_t2, winR_b2],
                    color: 'rgba(130, 190, 220, 0.45)', type: 'window'
                });
            }
        }

        // 🚪 ประตูทางเข้าหลัก
        const doorBotL = addNode('door_botL', -8, baseH, 0);
        const doorTopL = addNode('door_topL', -8, baseH + 42, 0);
        const doorTopR = addNode('door_topR', 8, baseH + 42, 0);
        const doorBotR = addNode('door_botR', 8, baseH, 0);

        dynamicFleshFaces.push({
            getZDepth: () => -5,
            nodes: [doorBotL, doorTopL, doorTopR, doorBotR],
            color: 'rgba(75, 45, 30, 0.9)', type: 'door'
        });

        // 🐍 บันไดนาคราชหน้าพระวิหาร (Grand Naga Staircase)
        const stairBaseL = addNode('stair_baseL', -12, groundH, 15);
        const stairTopL  = addNode('stair_topL', -12, baseH, 0);
        const stairBaseR = addNode('stair_baseR', 12, groundH, 15);
        const stairTopR  = addNode('stair_topR', 12, baseH, 0);

        skeletonLines.push({ p1: stairBaseL, p2: stairTopL, w: 2.5, type: 'stair' });
        skeletonLines.push({ p1: stairBaseR, p2: stairTopR, w: 2.5, type: 'stair' });
        
        dynamicFleshFaces.push({
            getZDepth: () => 5,
            nodes: [stairBaseL, stairTopL, stairTopR, stairBaseR],
            color: 'rgba(195, 175, 145, 0.75)', type: 'stair'
        });

        const spireBaseNode = addNode('spire_base', 0, upperRidgeH, -50);
        const spireTipNode  = addNode('spire_tip', 0, spireTopH, -50);
        skeletonLines.push({ p1: spireBaseNode, p2: spireTipNode, w: 2.2, type: 'struct' });

        for(let c = 1; c <= 4; c++) {
            let yL = upperRidgeH + (c * 12);
            let wS = 7 - (c * 1.2);
            const n1 = addNode(`chattra_l_${c}`, -wS, yL, -50);
            const n2 = addNode(`chattra_r_${c}`, wS, yL, -50);
            skeletonLines.push({ p1: n1, p2: n2, w: 1.4, type: 'struct' });
        }

        // 3. Projection & Ink Stylizer
        function project(x, y, z) {
            const angle = Math.PI / 6;
            const scale = 0.68;

            const isoX = (x - z) * Math.cos(angle);
            const isoY = -(y + (x + z) * Math.sin(angle));

            return {
                x: (isoX * scale) + (canvas.width / 2) - 20,
                y: (isoY * scale) + (canvas.height / 2) + 90
            };
        }

        function drawInkLine(p1, p2, width = 1.4, overShoot = 4, jitter = 0.6) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;

            const uX = dx / len;
            const uY = dy / len;
            const startX = p1.x - (uX * overShoot);
            const startY = p1.y - (uY * overShoot);
            const endX   = p2.x + (uX * overShoot);
            const endY   = p2.y + (uY * overShoot);

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            const steps = Math.max(2, Math.floor(len / 25));
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const rJ = (Math.random() - 0.5) * jitter;
                ctx.lineTo(startX + (endX - startX) * t + rJ, startY + (endY - startY) * t + rJ);
            }

            ctx.strokeStyle = '#2c241d';
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        let globalTime = 0;

        // 4. Main Render Loop
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            globalTime += 0.035;

            let lifecycle = 1.0;
            if (currentMode === 'time') {
                lifecycle = manualTimeFactor;
            } else {
                lifecycle = 1.0 + Math.sin(globalTime * 0.4) * 0.2;
            }

            nodesMap.forEach(node => node.update(globalTime, lifecycle));

            // เรนเดอร์ลานวัด (Courtyard)
            courtyardFaces.forEach(f => {
                const pts = f.vertices.map(v => project(v.x, v.y, v.z));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fillStyle = f.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(44, 36, 29, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // เรนเดอร์พื้นผิว ผนัง ประตู หน้าต่าง และบันได
            if ((currentMode === 'flesh' || currentMode === 'time') && lifecycle > 0.15) {
                dynamicFleshFaces.forEach(face => {
                    face.zDepth = face.getZDepth();
                });
                dynamicFleshFaces.sort((a, b) => a.zDepth - b.zDepth);

                const alphaMul = Math.min(1.0, lifecycle);
                dynamicFleshFaces.forEach(face => {
                    const pts = face.nodes.map(n => project(n.x, n.y, n.z));
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.closePath();
                    
                    if (face.type === 'wall') {
                        ctx.fillStyle = `rgba(244, 240, 230, ${0.85 * alphaMul})`;
                    } else if (face.type === 'door') {
                        ctx.fillStyle = `rgba(75, 45, 30, ${0.9 * alphaMul})`;
                    } else if (face.type === 'stair') {
                        ctx.fillStyle = `rgba(195, 175, 145, ${0.85 * alphaMul})`;
                    } else {
                        ctx.fillStyle = face.color.replace(/[\d\.]+\)$/i, `${0.4 * alphaMul})`);
                    }
                    ctx.fill();
                    ctx.strokeStyle = `rgba(44, 36, 29, ${0.28 * alphaMul})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                });
            }

            // เรนเดอร์โครงกระดูกและโครงสร้าง
            skeletonLines.forEach(line => {
                line.zDepth = (line.p1.z + line.p2.z) / 2;
            });
            skeletonLines.sort((a, b) => a.zDepth - b.zDepth);

            skeletonLines.forEach(line => {
                const p1 = project(line.p1.x, line.p1.y, line.p1.z);
                const p2 = project(line.p2.x, line.p2.y, line.p2.z);
                const alphaW = (currentMode === 'flesh' && line.type === 'struct') ? line.w * 0.6 : line.w;
                drawInkLine(p1, p2, alphaW, 4, 0.5);
            });

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
