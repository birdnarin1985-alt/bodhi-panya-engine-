<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya - Micro-step 2: Complete Roof System</title>
    <style>
        body { margin: 0; background: #f6f4ee; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="engineCanvas"></canvas>
    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }
        window.addEventListener('resize', resize);

        // 1. ISOMETRIC PROJECTION
        function project(x, y, z) {
            const angle = Math.PI / 6;
            const scale = 0.85;

            const isoX = (x - z) * Math.cos(angle);
            const isoY = -(y + (x + z) * Math.sin(angle));

            const screenX = (isoX * scale) + (canvas.width / 2) - 30;
            const screenY = (isoY * scale) + (canvas.height / 2) - 10;

            return { x: screenX, y: screenY };
        }

        // 2. PARAMETRIC ARCHITECTURE BUFFER (COMPLETE ROOF SYSTEM)
        const halfW = 26;       // ความกว้างโถง
        const eavesExt = 6;     // ระยะชายคาปีกยื่น
        const baseH = 20;       
        const pillarH = 50;     
        const beamH = baseH + pillarH; // 70
        
        const lowerRidgeH = beamH + 28;   // สันหลังคาชั้นล่าง
        const upperRidgeH = beamH + 55;   // สันหลังคาชั้นบน (ประธาน)

        const totalBays = 20;   
        const bayLen = 16.5;    

        const sceneGraph = [];

        for (let i = 0; i < totalBays; i++) {
            const zFront = -(i * bayLen);
            const zBack  = -((i + 1) * bayLen);

            // ฐานเสาและหัวเสา
            const colL_base = { x: -halfW, y: baseH, z: zFront };
            const colL_top  = { x: -halfW, y: beamH, z: zFront };
            const colR_base = { x:  halfW, y: baseH, z: zFront };
            const colR_top  = { x:  halfW, y: beamH, z: zFront };

            const colL_top_back = { x: -halfW, y: beamH, z: zBack };
            const colR_top_back = { x:  halfW, y: beamH, z: zBack };

            // ชายคายื่น (Eaves Overhang)
            const eaveL_front = { x: -(halfW + eavesExt), y: beamH + 5, z: zFront + 2 };
            const eaveR_front = { x:  (halfW + eavesExt), y: beamH + 5, z: zFront + 2 };
            const eaveL_back  = { x: -(halfW + eavesExt), y: beamH + 5, z: zBack - 2 };
            const eaveR_back  = { x:  (halfW + eavesExt), y: beamH + 5, z: zBack - 2 };

            // สันอกไก่
            const rLowerFront = { x: 0, y: lowerRidgeH, z: zFront };
            const rLowerBack  = { x: 0, y: lowerRidgeH, z: zBack };
            const rUpperFront = { x: 0, y: upperRidgeH, z: zFront };
            const rUpperBack  = { x: 0, y: upperRidgeH, z: zBack };

            // ระนาบพื้น
            sceneGraph.push({
                type: 'face',
                id: `floor-${i}`,
                vertices: [
                    { x: -halfW, y: baseH, z: zBack },
                    { x:  halfW, y: baseH, z: zBack },
                    { x:  halfW, y: baseH, z: zFront },
                    { x: -halfW, y: baseH, z: zFront }
                ],
                fillAccent: i % 2 === 0 ? 'rgba(230, 150, 40, 0.18)' : null,
                hatch: false
            });

            // ผืนหลังคาชั้นล่าง (ฝั่งขวา)
            sceneGraph.push({
                type: 'face',
                id: `roof-lower-right-${i}`,
                vertices: [rLowerBack, rLowerFront, colR_top, colR_top_back],
                fillAccent: 'rgba(230, 140, 40, 0.2)',
                hatch: false
            });

            // ผืนหลังคาชั้นบน (ฝั่งขวา - หลังคาประธาน)
            sceneGraph.push({
                type: 'face',
                id: `roof-upper-right-${i}`,
                vertices: [rUpperBack, rUpperFront, rLowerFront, rLowerBack],
                fillAccent: 'rgba(230, 140, 40, 0.3)',
                hatch: false
            });

            // หน้าจั่วหน้าสุด (เฉพาะช่วง i === 0)
            if (i === 0) {
                // จั่วชั้นล่าง
                sceneGraph.push({
                    type: 'face',
                    id: 'gable-lower-front',
                    vertices: [rLowerFront, colL_top, colR_top],
                    fillAccent: null,
                    hatch: true,
                    hatchDensity: 5
                });
                // จั่วชั้นบน
                sceneGraph.push({
                    type: 'face',
                    id: 'gable-upper-front',
                    vertices: [rUpperFront, { x: -16, y: lowerRidgeH, z: zFront }, { x: 16, y: lowerRidgeH, z: zFront }],
                    fillAccent: null,
                    hatch: true,
                    hatchDensity: 6
                });

                // เส้นโครงสร้างจั่วหน้า
                sceneGraph.push({ type: 'line', v1: colL_top, v2: colR_top, width: 2.0, overShoot: 6, jitter: 1.0 });
                sceneGraph.push({ type: 'line', v1: rLowerFront, v2: colL_top, width: 1.8, overShoot: 6, jitter: 1.0 });
                sceneGraph.push({ type: 'line', v1: rLowerFront, v2: colR_top, width: 1.8, overShoot: 6, jitter: 1.0 });
                sceneGraph.push({ type: 'line', v1: rUpperFront, v2: { x: -16, y: lowerRidgeH, z: zFront }, width: 1.6, overShoot: 5, jitter: 0.9 });
                sceneGraph.push({ type: 'line', v1: rUpperFront, v2: { x: 16, y: lowerRidgeH, z: zFront }, width: 1.6, overShoot: 5, jitter: 0.9 });
            }

            // เสาวิหารแก้ว
            sceneGraph.push({ type: 'line', v1: colL_base, v2: colL_top, width: 1.6, overShoot: 5, jitter: 0.9 });
            sceneGraph.push({ type: 'line', v1: colR_base, v2: colR_top, width: 1.6, overShoot: 5, jitter: 0.9 });

            // คานยาว
            sceneGraph.push({ type: 'line', v1: colL_top, v2: colL_top_back, width: 1.4, overShoot: 4, jitter: 0.8 });
            sceneGraph.push({ type: 'line', v1: colR_top, v2: colR_top_back, width: 1.4, overShoot: 4, jitter: 0.8 });

            // สันอกไก่ยาวตลอดแนว
            sceneGraph.push({ type: 'line', v1: rLowerFront, v2: rLowerBack, width: 1.6, overShoot: 5, jitter: 0.9 });
            sceneGraph.push({ type: 'line', v1: rUpperFront, v2: rUpperBack, width: 2.0, overShoot: 6, jitter: 1.0 });
        }

        // 3. STYLIZER FUNCTIONS
        function drawInkLine(p1, p2, width = 1.4, overShoot = 5, jitter = 0.9) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;

            const uX = dx / len;
            const uY = dy / len;

            const startX = p1.x - (uX * overShoot);
            const startY = p1.y - (uY * overShoot);
            const endX   = p2.x + (uX * overShoot);
            const endY   = p2.y + (uY * overShoot);

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            const steps = Math.max(2, Math.floor(len / 18));
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const rJitterX = (Math.random() - 0.5) * jitter;
                const rJitterY = (Math.random() - 0.5) * jitter;
                ctx.lineTo(startX + (endX - startX) * t + rJitterX, startY + (endY - startY) * t + rJitterY);
            }

            ctx.strokeStyle = '#1e1c1a';
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawFaceHatching(pts, density = 6) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.clip();

            ctx.strokeStyle = 'rgba(30, 28, 25, 0.4)';
            ctx.lineWidth = 0.85;

            let minX = Math.min(...pts.map(p => p.x));
            let maxX = Math.max(...pts.map(p => p.x));
            let minY = Math.min(...pts.map(p => p.y));
            let maxY = Math.max(...pts.map(p => p.y));

            for (let x = minX - (maxY - minY); x < maxX; x += density) {
                ctx.beginPath();
                ctx.moveTo(x, minY);
                ctx.lineTo(x + (maxY - minY), maxY);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 4. PIPELINE: SORT & DRAW
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sceneGraph.forEach(item => {
                if (item.type === 'face') {
                    let zSum = 0;
                    item.vertices.forEach(v => zSum += (v.x + v.y + v.z));
                    item.zDepth = zSum / item.vertices.length;
                } else if (item.type === 'line') {
                    item.zDepth = (item.v1.x + item.v1.y + item.v1.z + item.v2.x + item.v2.y + item.v2.z) / 2;
                }
            });
            sceneGraph.sort((a, b) => a.zDepth - b.zDepth);

            // Pass 1: ระบายสีและสานเงา
            sceneGraph.forEach(item => {
                if (item.type === 'face') {
                    const pts = item.vertices.map(v => project(v.x, v.y, v.z));
                    if (item.fillAccent) {
                        ctx.beginPath();
                        ctx.moveTo(pts[0].x, pts[0].y);
                        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                        ctx.closePath();
                        ctx.fillStyle = item.fillAccent;
                        ctx.fill();
                    }
                    if (item.hatch) {
                        drawFaceHatching(pts, item.hatchDensity);
                    }
                }
            });

            // Pass 2: เส้นหมึกสเก็ตช์
            sceneGraph.forEach(item => {
                if (item.type === 'line') {
                    const p1 = project(item.v1.x, item.v1.y, item.v1.z);
                    const p2 = project(item.v2.x, item.v2.y, item.v2.z);
                    drawInkLine(p1, p2, item.width, item.overShoot, item.jitter);
                }
            });
        }

        resize();
    </script>
</body>
</html>
