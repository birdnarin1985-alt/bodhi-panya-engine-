<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya Engine - Manomayiddhi Suite</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif;
            user-select: none;
            touch-action: none;
        }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.85);
            padding: 20px 30px;
            border-radius: 16px;
            border-top: 2px solid #e0b471;
            width: 85%;
            max-width: 400px;
            color: #e0e0e0;
            box-shadow: 0 -10px 40px rgba(224, 180, 113, 0.15);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        h1 { margin: 0 0 10px 0; font-size: 16px; font-weight: 600; color: #e0b471; letter-spacing: 1.5px; }
        
        .slider-container {
            margin-top: 15px;
            text-align: left;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #a0a0a0;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #e0b471;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #status-text {
            margin-top: 12px;
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <canvas id="engineCanvas"></canvas>

    <div id="ui-overlay">
        <h1>BODHI-PANYA : MANOMAYIDDHI</h1>
        
        <div class="slider-container">
            <div class="slider-labels">
                <span>ว้าวุ่น (0%)</span>
                <span>กายแก้ว (80%)</span>
                <span>ถอดกายทิพย์ (100%)</span>
            </div>
            <input type="range" id="samadhiSlider" min="0" max="100" step="1" value="50" oninput="updateSamadhi(this.value)">
        </div>
        <div id="status-text">สภาวะ: อุปจารสมาธิ (รวบรวมธาตุ ๔)</div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');

        let samadhiLevel = 50; // 0 - 100

        function updateSamadhi(val) {
            samadhiLevel = parseInt(val);
            if (samadhiLevel < 25) {
                statusText.innerText = "สภาวะ: นิวรณ์ครอบงำ (ธาตุแตกซ่าน ไร้ระเบียบ)";
                statusText.style.color = "#ff4444";
            } else if (samadhiLevel < 80) {
                statusText.innerText = "สภาวะ: อุปจารสมาธิ (รวบรวมสติและธาตุ ๔)";
                statusText.style.color = "#00ffcc";
            } else if (samadhiLevel < 100) {
                statusText.innerText = "สภาวะ: ปฐมฌาน (กายผลึกแก้ว & ยันต์เกราะเพชร)";
                statusText.style.color = "#ffffff";
            } else {
                statusText.innerText = "สภาวะ: มโนมยิทธิ (ถอดกายทิพย์สำเร็จด้วยใจ)";
                statusText.style.color = "#ffd700";
            }
        }
        updateSamadhi(50); // Init text

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Interaction (Differentiation Tool)
        let pointer = { x: -1000, y: -1000, active: false };
        function updatePointer(e) {
            pointer.x = e.clientX || (e.touches && e.touches[0].clientX);
            pointer.y = e.clientY || (e.touches && e.touches[0].clientY);
        }
        canvas.addEventListener('mousedown', (e) => { pointer.active = true; updatePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(pointer.active) updatePointer(e); });
        window.addEventListener('mouseup', () => { pointer.active = false; pointer.x = -1000; });
        canvas.addEventListener('touchstart', (e) => { pointer.active = true; updatePointer(e); }, {passive: true});
        canvas.addEventListener('touchmove', (e) => { if(pointer.active) updatePointer(e); }, {passive: true});
        window.addEventListener('touchend', () => { pointer.active = false; pointer.x = -1000; });

        // Cellular Node System (Linked List)
        class KalapaNode {
            constructor(x, y, type) {
                this.ox = x; this.oy = y; // พิกัดกายเนื้อ (รูปขันธ์)
                this.x = x + (Math.random() - 0.5) * 800; // พิกัดปัจจุบัน
                this.y = y + (Math.random() - 0.5) * 800;
                this.vx = 0; this.vy = 0;
                this.type = type;
                this.next = null;
            }

            update(globalTime) {
                // คำนวณแรงตามระดับสมาธิ
                let integrationForce = Math.max(0.001, (samadhiLevel / 100) * 0.08); // แรงสปริงดึงกลับ
                let entropyFactor = Math.max(0, (80 - samadhiLevel) / 80); // ความว้าวุ่น

                // ทิศทางเป้าหมาย (หากเป็นมโนมยิทธิ กายทิพย์จะลอยขึ้น)
                let targetY = this.oy;
                if (samadhiLevel === 100) {
                    targetY = this.oy - 120; // กายทิพย์ลอยขึ้น
                }

                // ลมหายใจ (Sine wave)
                let breath = 0;
                if (samadhiLevel > 25) {
                    breath = Math.sin(globalTime * 2 + this.oy * 0.02) * (samadhiLevel === 100 ? 4 : 2);
                }

                let dx = this.ox - this.x;
                let dy = (targetY + breath) - this.y;

                // 1. Integration (ดึงเข้าหากัน)
                this.vx += dx * integrationForce;
                this.vy += dy * integrationForce;

                // 2. Entropy (ความฟุ้งซ่าน)
                if (entropyFactor > 0) {
                    this.vx += (Math.random() - 0.5) * entropyFactor * 15;
                    this.vy += (Math.random() - 0.5) * entropyFactor * 15;
                }

                // 3. Differentiation (แรงปะทะจากนิ้ว - กิเลสภายนอก)
                // ถ้าระดับสมาธิ >= 80 (เกราะเพชร) นิ้วจะทำลายโครงสร้างไม่ได้
                if (pointer.active && samadhiLevel < 80) {
                    let tx = this.x - pointer.x;
                    let ty = this.y - pointer.y;
                    let dist = Math.sqrt(tx*tx + ty*ty);
                    if (dist < 100) {
                        let force = (100 - dist) / 100;
                        this.vx += (tx / dist) * force * 10;
                        this.vy += (ty / dist) * force * 10;
                    }
                }

                // ฟิสิกส์
                this.vx *= 0.85; // Friction
                this.vy *= 0.85;
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        // Generate Anatomy Points
        let headNode = null;
        let tailNode = null;
        let nodesArray = [];

        function addNode(x, y, type) {
            let n = new KalapaNode(x, y, type);
            if (!headNode) headNode = n;
            else tailNode.next = n;
            tailNode = n;
            nodesArray.push(n);
        }

        function initBody() {
            let cx = window.innerWidth / 2;
            let cy = window.innerHeight / 2 - 100;

            // กะโหลก
            for(let i=0; i<400; i++) {
                let a = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random()) * 40;
                addNode(cx + Math.cos(a)*r, cy - 60 + Math.sin(a)*r*1.2, 'skull');
            }
            // กระดูกสันหลัง
            for(let i=0; i<300; i++) {
                addNode(cx + (Math.random()-0.5)*8, cy + Math.random()*250, 'spine');
            }
            // ซี่โครง
            for(let i=0; i<1200; i++) {
                let yOff = Math.random() * 150;
                let w = Math.sin((yOff/150)*Math.PI) * 60;
                addNode(cx + (Math.random()>0.5?1:-1) * Math.random()*w, cy + 20 + yOff, 'rib');
            }
        }
        initBody();

        let globalTime = 0;

        function renderLoop() {
            // Clear screen (Motion Blur)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            globalTime += 0.03;

            // 1. Render Physical Body (กายเนื้อที่ถูกทิ้งไว้ หากเป็นมโนมยิทธิ)
            if (samadhiLevel === 100) {
                ctx.fillStyle = 'rgba(100, 100, 100, 0.15)'; // สีขี้เถ้าทึบๆ
                nodesArray.forEach(n => {
                    ctx.beginPath();
                    // กายเนื้อจะค่อยๆ ร่วงลงพื้นนิดหน่อย (Gravity)
                    ctx.arc(n.ox, n.oy + 80, 1.5, 0, Math.PI*2);
                    ctx.fill();
                });
            }

            // 2. Render Yant (ยันต์เกราะเพชร - ปรากฏเมื่อสมาธิ >= 80)
            if (samadhiLevel >= 80) {
                let cx = window.innerWidth / 2;
                // ถอดกายทิพย์ ยันต์จะลอยตามขึ้นไป
                let cy = (window.innerHeight / 2 - 100) + 80 + (samadhiLevel === 100 ? -120 : 0); 
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = samadhiLevel === 100 ? '#ffd700' : '#ffffff';
                ctx.strokeStyle = samadhiLevel === 100 ? 'rgba(255, 215, 0, 0.5)' : 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1.5;
                
                let sides = 6;
                let radius = 140 + Math.sin(globalTime * 2) * 5;
                
                // วาดลายตาข่ายเกราะเพชร
                ctx.beginPath();
                for(let i=0; i<=sides; i++) {
                    let angle = (i/sides) * Math.PI * 2 + globalTime*0.2;
                    let px = cx + Math.cos(angle) * radius;
                    let py = cy + Math.sin(angle) * radius * 1.5;
                    if(i===0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                
                // วงกลมศูนย์กลาง
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.3, 0, Math.PI*2);
                ctx.stroke();
                
                ctx.shadowBlur = 0; // Reset
            }

            // 3. Render Active Nodes (สายใยเซลล์กลาปะ / กายทิพย์)
            // กำหนดสีตามระดับสมาธิ
            let r=100, g=100, b=100, alpha=0.5;
            if (samadhiLevel < 25) { r=180; g=50; b=50; alpha=0.3; } // ว้าวุ่น
            else if (samadhiLevel < 80) { r=0; g=255; b=204; alpha=0.6; } // รวมสติ
            else if (samadhiLevel < 100) { r=255; g=255; b=255; alpha=0.8; } // ปฐมฌาน
            else { r=255; g=215; b=0; alpha=0.9; } // มโนมยิทธิ (สีทอง)

            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;

            let current = headNode;
            while(current) {
                current.update(globalTime);
                
                ctx.beginPath();
                ctx.arc(current.x, current.y, samadhiLevel===100 ? 1.5 : 1.2, 0, Math.PI*2);
                ctx.fill();

                // วาดเส้นสายใย Linked List
                if (current.next && samadhiLevel > 25 && Math.random() < (samadhiLevel/100)*0.1) {
                    ctx.beginPath();
                    ctx.moveTo(current.x, current.y);
                    ctx.lineTo(current.next.x, current.next.y);
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
                    ctx.stroke();
                }

                current = current.next;
            }

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
