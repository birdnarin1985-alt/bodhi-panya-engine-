<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya Engine - Complete Living Skeleton X-Ray</title>
    <style>
        body { margin: 0; background: #f6f4ee; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute; bottom: 20px; left: 20px;
            font-family: monospace; font-size: 12px; color: #443;
            background: rgba(255,255,255,0.85); padding: 8px 14px; border-radius: 4px;
            pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <canvas id="engineCanvas"></canvas>
    <div id="info">Bodhi-Panya Engine: Complete Living Skeleton (20 Bays / 100M Wireframe Breath)</div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. นาม & ธาตุวาโย (Cellular Breath Node)
        class SkeletonNode {
            constructor(id, x, y, z) {
                this.id = id;
                this.ox = x; this.oy = y; this.oz = z;
                this.x = x; this.y = y; this.z = z;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.03;
                this.amplitude = 0.45; // ความไหวของลมหายใจโครงกระดูก
            }

            update(time) {
                this.phase += this.speed;
                // ให้โครงสร้างช่วงบนขยับไหวเบาๆ ตามลมหายใจ
                if (this.oy > 20) {
                    this.x = this.ox + Math.sin(this.phase + time) * this.amplitude;
                }
            }
        }

        // 2. สร้างโครงกระดูกทั้งระบบ (20 ช่วงเสา 100 เมตร)
        const halfW = 28;       
        const baseH = 20;       
        const pillarH = 50;     
        const beamH = baseH + pillarH; // 70
        
        const lowerRidgeH = beamH + 32;   
        const upperRidgeH = beamH + 68;   
        const spireTopH   = upperRidgeH + 85; 

        const totalBays = 20;   
        const bayLen = 16.5;    

        const nodesMap = new Map();
        const skeletonLines = [];

        function addNode(id, x, y, z) {
            if (!nodesMap.has(id)) {
                nodesMap.set(id, new SkeletonNode(id, x, y, z));
            }
            return nodesMap.get(id);
        }

        for (let i = 0; i < totalBays; i++) {
            const zFront = -(i * bayLen);
            const zBack  = -((i + 1) * bayLen);

            // พิกัดโหนดเสาและคาน
            const cL_base = addNode(`colL_base_${i}`, -halfW, baseH, zFront);
            const cL_top  = addNode(`colL_top_${i}`, -halfW, beamH, zFront);
            const cR_base = addNode(`colR_base_${i}`, halfW, baseH, zFront);
            const cR_top  = addNode(`colR_top_${i}`, halfW, beamH, zFront);

            const cL_top_back = addNode(`colL_top_${i+1}`, -halfW, beamH, zBack);
            const cR_top_back = addNode(`colR_top_${i+1}`, halfW, beamH, zBack);

            // สันอกไก่
            const rLowFront = addNode(`rLow_${i}`, 0, lowerRidgeH, zFront);
            const rLowBack  = addNode(`rLow_${i+1}`, 0, lowerRidgeH, zBack);
            const rUpFront  = addNode(`rUp_${i}`, 0, upperRidgeH, zFront);
            const rUpBack   = addNode(`rUp_${i+1}`, 0, upperRidgeH, zBack);

            // A. เสาหลักซ้าย-ขวา
            skeletonLines.push({ p1: cL_base, p2: cL_top, w: 1.6 });
            skeletonLines.push({ p1: cR_base, p2: cR_top, w: 1.6 });

            // B. คานหัวเสายาวตลอดแนวอาคาร
            skeletonLines.push({ p1: cL_top, p2: cL_top_back, w: 1.4 });
            skeletonLines.push({ p1: cR_top, p2: cR_top_back, w: 1.4 });

            // C. สันอกไก่หลังคา
            skeletonLines.push({ p1: rLowFront, p2: rLowBack, w: 1.5 });
            skeletonLines.push({ p1: rUpFront, p2: rUpBack, w: 1.8 });

            // D. โครงจันทันรับหลังคา
            skeletonLines.push({ p1: cL_top, p2: rLowFront, w: 1.3 });
            skeletonLines.push({ p1: cR_top, p2: rLowFront, w: 1.3 });
            skeletonLines.push({ p1: rLowFront, p2: rUpFront, w: 1.4 });

            // โครงจั่วหน้าสุด (i === 0)
            if (i === 0) {
                skeletonLines.push({ p1: cL_top, p2: cR_top, w: 2.0 });
                skeletonLines.push({ p1: rUpFront, p2: { x: -18, y: lowerRidgeH, z: zFront }, w: 1.4 });
                skeletonLines.push({ p1: rUpFront, p2: { x: 18, y: lowerRidgeH, z: zFront }, w: 1.4 });
            }
        }

        // E. ยอดฉัตรกลางอาคาร
        const spireBaseNode = addNode('spire_base', 0, upperRidgeH, -50);
        const spireTipNode  = addNode('spire_tip', 0, spireTopH, -50);
        skeletonLines.push({ p1: spireBaseNode, p2: spireTipNode, w: 2.2 });

        for(let c = 1; c <= 4; c++) {
            let yL = upperRidgeH + (c * 12);
            let wS = 7 - (c * 1.2);
            const n1 = addNode(`chattra_l_${c}`, -wS, yL, -50);
            const n2 = addNode(`chattra_r_${c}`, wS, yL, -50);
            skeletonLines.push({ p1: n1, p2: n2, w: 1.5 });
        }

        // 3. รูป & ธาตุดิน-น้ำ (Isometric Projection & Ink Stylizer)
        function project(x, y, z) {
            const angle = Math.PI / 6;
            const scale = 0.72;

            const isoX = (x - z) * Math.cos(angle);
            const isoY = -(y + (x + z) * Math.sin(angle));

            return {
                x: (isoX * scale) + (canvas.width / 2) - 20,
                y: (isoY * scale) + (canvas.height / 2) + 60
            };
        }

        function drawInkLine(p1, p2, width = 1.4, overShoot = 5, jitter = 0.7) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;

            const uX = dx / len;
            const uY = dy / len;
            const startX = p1.x - (uX * overShoot);
            const startY = p1.y - (uY * overShoot);
            const endX   = p2.x + (uX * overShoot);
            const endY   = p2.y + (uY * overShoot);

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            const steps = Math.max(2, Math.floor(len / 20));
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const rJ = (Math.random() - 0.5) * jitter;
                ctx.lineTo(startX + (endX - startX) * t + rJ, startY + (endY - startY) * t + rJ);
            }

            ctx.strokeStyle = '#1e1c1a';
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        let globalTime = 0;

        // 4. Main Render Loop
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            globalTime += 0.04;

            // อัปเดตลมหายใจทุกโหนดโครงกระดูก
            nodesMap.forEach(node => node.update(globalTime));

            // จัดเรียงลำดับความลึก Z-Depth Sorting เพื่อให้เส้นโครงกระดูกบังกันอย่างถูกต้อง
            skeletonLines.forEach(line => {
                line.zDepth = (line.p1.z + line.p2.z) / 2;
            });
            skeletonLines.sort((a, b) => a.zDepth - b.zDepth);

            // วาดเส้นโครงกระดูกทั้งหมด
            skeletonLines.forEach(line => {
                const p1 = project(line.p1.x, line.p1.y, line.p1.z);
                const p2 = project(line.p2.x, line.p2.y, line.p2.z);
                drawInkLine(p1, p2, line.w, 4, 0.6);
            });

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
